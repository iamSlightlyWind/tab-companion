name: Build Tab Companion update

on:
  push:
    branches: [main]
    # Keep the Linux updater provenance feed free of Android-only runs and
    # trigger only for files that can change a shipped Linux package/release.
    paths:
      - 'src/**'
      - 'ports/ubuntu-x910/**'
      - 'ports/fedora-x810/**'
      - 'ports/arch-x810/**'
      - 'packaging/**'
      - 'tools/build-ubuntu-deb.sh'
      - 'tools/build-fedora-rpm.sh'
      - 'tools/build-aur-source.sh'
      - 'tools/sync-package-stages.py'
      - 'tools/write-app-build-metadata.py'
      - 'tools/make-actions-index.py'
      - 'tools/make_legacy_release_assets.py'
      - 'tests/**'
      - '!tests/test_android_release_manifest.py'
      - 'LICENSE'
      - '.github/workflows/build-updates.yml'
      - '.github/workflows/cleanup-build-releases.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tab-companion-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      APP_BUILD_RUN_ID: ${{ github.run_id }}
      APP_BUILD_RUN_NUMBER: ${{ github.run_number }}
      APP_BUILD_HEAD_SHA: ${{ github.sha }}
      APP_BUILD_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev python3

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build Ubuntu DEB
        run: |
          set -euo pipefail
          rm -rf ports/ubuntu-x910/out
          bash tools/build-ubuntu-deb.sh
          mkdir -p build/tab-companion-ubuntu
          mapfile -t packages < <(find ports/ubuntu-x910/out -maxdepth 1 -type f -name '*.deb' -print)
          [[ ${#packages[@]} -eq 1 ]]
          cp "${packages[0]}" build/tab-companion-ubuntu/

      - name: Generate Ubuntu update index
        run: python3 tools/make-actions-index.py build/tab-companion-ubuntu ubuntu

      - name: Upload Ubuntu update artifact
        uses: actions/upload-artifact@v6
        with:
          name: tab-companion-ubuntu
          path: build/tab-companion-ubuntu/
          if-no-files-found: error
          retention-days: 90

  fedora:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      APP_BUILD_RUN_ID: ${{ github.run_id }}
      APP_BUILD_RUN_NUMBER: ${{ github.run_number }}
      APP_BUILD_HEAD_SHA: ${{ github.sha }}
      APP_BUILD_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install test and index tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 rpm

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Prepare Fedora DNF cache mount
        run: mkdir -p "$RUNNER_TEMP/fedora44-libdnf5-cache"

      - name: Cache Fedora 44 build-tool RPMs and metadata
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fedora44-libdnf5-cache
          key: fedora44-libdnf5-v1-${{ hashFiles('packaging/fedora/tab-companion.spec', 'tools/build-fedora-rpm.sh') }}
          restore-keys: fedora44-libdnf5-v1-

      - name: Build Fedora RPM in the official Fedora container
        run: |
          set -euo pipefail
          rm -rf ports/fedora-x810/out
          mkdir -p build/tab-companion-fedora
          docker run --rm \
            -v "$RUNNER_TEMP/fedora44-libdnf5-cache:/var/cache/libdnf5" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e APP_BUILD_RUN_ID="$APP_BUILD_RUN_ID" \
            -e APP_BUILD_RUN_NUMBER="$APP_BUILD_RUN_NUMBER" \
            -e APP_BUILD_HEAD_SHA="$APP_BUILD_HEAD_SHA" \
            -e APP_BUILD_BRANCH="$APP_BUILD_BRANCH" \
            fedora:44 bash -euc '
              dnf -y --setopt=keepcache=True install rpm-build tar findutils python3 coreutils
              tools/build-fedora-rpm.sh
            '
          mapfile -t rpms < <(find ports/fedora-x810/out/rpms -maxdepth 1 -type f -name '*.rpm' -print)
          [[ ${#rpms[@]} -eq 1 ]]
          cp "${rpms[0]}" build/tab-companion-fedora/

      - name: Generate Fedora update index
        run: python3 tools/make-actions-index.py build/tab-companion-fedora fedora

      - name: Upload Fedora update artifact
        uses: actions/upload-artifact@v6
        with:
          name: tab-companion-fedora
          path: build/tab-companion-fedora/
          if-no-files-found: error
          retention-days: 90

  arch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      APP_BUILD_RUN_ID: ${{ github.run_id }}
      APP_BUILD_RUN_NUMBER: ${{ github.run_number }}
      APP_BUILD_HEAD_SHA: ${{ github.sha }}
      APP_BUILD_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build self-contained Arch update source
        run: |
          set -euo pipefail
          base_version=$(sed -n 's/^Version: //p' ports/ubuntu-x910/DEBIAN/control | head -n1)
          pkgrel=$((1000000 + APP_BUILD_RUN_NUMBER))
          tools/build-aur-source.sh "$base_version" "$pkgrel"
          mapfile -t sources < <(find ports/fedora-x810/out/arch -maxdepth 1 -type f -name 'tab-companion-aur-source.tar.gz' -print)
          [[ ${#sources[@]} -eq 1 ]]
          mkdir -p build/tab-companion-arch
          cp "${sources[0]}" build/tab-companion-arch/tab-companion-arch-source.tar.gz

      - name: Validate source using Arch makepkg
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/build/tab-companion-arch:/artifact" \
            archlinux:base-devel bash -euc '
              useradd --create-home builder
              mkdir -p /home/builder/build
              tar -xzf /artifact/tab-companion-arch-source.tar.gz -C /home/builder/build
              chown -R builder:builder /home/builder/build
              su builder -s /bin/bash -c "cd /home/builder/build && makepkg --nodeps --noconfirm --cleanbuild"
            '

      - name: Generate Arch update index
        run: python3 tools/make-actions-index.py build/tab-companion-arch arch

      - name: Upload Arch update artifact
        uses: actions/upload-artifact@v6
        with:
          name: tab-companion-arch
          path: build/tab-companion-arch/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [ubuntu, fedora, arch]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@v6

      - name: Download the distro-specific build artifacts
        uses: actions/download-artifact@v7
        with:
          name: tab-companion-ubuntu
          path: ${{ runner.temp }}/tab-companion-ubuntu

      - name: Download Fedora build artifact
        uses: actions/download-artifact@v7
        with:
          name: tab-companion-fedora
          path: ${{ runner.temp }}/tab-companion-fedora

      - name: Download Arch build artifact
        uses: actions/download-artifact@v7
        with:
          name: tab-companion-arch
          path: ${{ runner.temp }}/tab-companion-arch

      - name: Package public release assets and legacy index
        env:
          RELEASE_DIR: ${{ runner.temp }}/tab-companion-release
        run: |
          set -euo pipefail
          python3 tools/make_legacy_release_assets.py "$RUNNER_TEMP" "$RELEASE_DIR" \
            --repo "$GITHUB_REPOSITORY" --tag "tab-companion-build-${GITHUB_RUN_ID}" \
            --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME"

      - name: Publish rolling latest successful build release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/tab-companion-release
        run: |
          set -euo pipefail
          tag="tab-companion-build-${GITHUB_RUN_ID}"
          mapfile -t assets < <(find "$RELEASE_DIR" -maxdepth 1 -type f -print | sort)
          [[ ${#assets[@]} -eq 7 ]]
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Tab Companion build #${GITHUB_RUN_NUMBER}" \
              --notes "Automatically updated from the successful main-branch build."
          fi

      - name: Remove superseded build releases and temporary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Run IDs increase monotonically. Delete only older releases so a
          # delayed earlier run can never prune the release from a newer run.
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName --jq '.[].tagName | select(startswith("tab-companion-build-"))')
          while IFS= read -r tag; do
            [[ "$tag" =~ ^tab-companion-build-([0-9]+)$ ]] || continue
            old_run_id="${BASH_REMATCH[1]}"
            if (( old_run_id < GITHUB_RUN_ID )); then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done <<< "$tags"

          artifact_ids=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "tab-companion-ubuntu" or .name == "tab-companion-fedora" or .name == "tab-companion-arch") | .id')
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done <<< "$artifact_ids"
