name: Keep latest Tab Companion build release

on:
  workflow_run:
    workflows: [Build Tab Companion update]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove superseded build releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-updates.yml/runs?branch=main&event=push&status=completed&per_page=100")
          latest_run=$(jq -er '[.workflow_runs[] | select(.conclusion == "success")] | max_by(.run_number).id' <<<"$runs")
          keep_tag="tab-companion-build-${latest_run}"
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName --jq '.[].tagName | select(startswith("tab-companion-build-"))')
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$keep_tag" ]] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done <<< "$tags"

      - name: Delete published package staging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # The updater downloads the public run-keyed release, not Actions
          # artifacts. Those packages are only handoff files for the publish
          # job, so remove only this completed run's files after publication.
          artifact_ids=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "tab-companion-ubuntu" or .name == "tab-companion-fedora" or .name == "tab-companion-arch") | .id')
          mapfile -t ids <<< "$artifact_ids"
          for id in "${ids[@]}"; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
